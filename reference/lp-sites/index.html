<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LP参考サイト｜8サイト比較</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: #f4f5f7; background: #11151d; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .viewer { display: flex; flex-direction: column; height: 100dvh; min-height: 400px; }
    header { display: flex; align-items: center; gap: 24px; padding: 12px 20px; border-bottom: 1px solid #343a46; background: #171c26; }
    .heading { flex: 0 0 auto; }
    h1 { margin: 0; font-size: 15px; line-height: 1.3; letter-spacing: .02em; }
    .subheading { margin: 3px 0 0; color: #aab2c1; font-size: 11px; }
    .tabs { display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
    .tab { flex: 0 0 auto; padding: 9px 16px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: #b9c0cc; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .tab:hover { background: #282f3c; color: #fff; }
    .tab[aria-selected="true"] { border-color: #5c83ff; background: #26355b; color: #fff; }
    .tab:focus-visible { outline: 2px solid #8ca8ff; outline-offset: 2px; }
    .source { margin-left: auto; min-width: 0; color: #aab2c1; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source a { color: #b6c8ff; text-decoration: none; }
    .source a:hover { text-decoration: underline; }
    iframe { display: block; flex: 1; width: 100%; border: 0; background: #fff; }
    @media (max-width: 850px) {
      header { flex-wrap: wrap; gap: 8px 16px; padding: 10px 12px; }
      .heading { width: 100%; }
      .tabs { width: 100%; }
      .source { display: none; }
    }
  </style>
</head>
<body>
  <div class="viewer">
    <header>
      <div class="heading">
        <h1>LP参考サイト</h1>
        <p class="subheading">8サイトをタブで切り替え</p>
      </div>
      <nav class="tabs" role="tablist" aria-label="参考サイト">
        <button class="tab" type="button" role="tab" id="tab-haagen-dazs" aria-controls="site-frame" data-site="haagen-dazs">ハーゲンダッツ</button>
        <button class="tab" type="button" role="tab" id="tab-sunshine-autumn" aria-controls="site-frame" data-site="sunshine-autumn">サンシャインシティ</button>
        <button class="tab" type="button" role="tab" id="tab-many-people" aria-controls="site-frame" data-site="many-people">MANY PEOPLE</button>
        <button class="tab" type="button" role="tab" id="tab-misignal" aria-controls="site-frame" data-site="misignal">マイシグナル</button>
        <button class="tab" type="button" role="tab" id="tab-financial-japan" aria-controls="site-frame" data-site="financial-japan">ファイナンシャル・ジャパン</button>
        <button class="tab" type="button" role="tab" id="tab-elixir" aria-controls="site-frame" data-site="elixir">エリクシール</button>
        <button class="tab" type="button" role="tab" id="tab-stripe" aria-controls="site-frame" data-site="stripe">Stripe</button>
        <button class="tab" type="button" role="tab" id="tab-zendesk" aria-controls="site-frame" data-site="zendesk">Zendesk</button>
      </nav>
      <div class="source">元サイト：<a id="source-link" target="_blank" rel="noopener noreferrer"></a></div>
    </header>
    <iframe id="site-frame" title="LPプレビュー" aria-labelledby="tab-haagen-dazs"></iframe>
  </div>
  <script>
    const sites = {
      "haagen-dazs": { label: "ハーゲンダッツ", source: "https://www.haagen-dazs.co.jp/", preview: "https://www.haagen-dazs.co.jp/" },
      "sunshine-autumn": { label: "サンシャインシティ", source: "https://sunshinecity.jp/file/official/autumn/", preview: "sunshine-autumn/index.html" },
      "many-people": { label: "MANY PEOPLE", source: "https://www.manypeople-k.com/recruit/", preview: "many-people/index.html" },
      misignal: { label: "マイシグナル", source: "https://misignal.jp/", preview: "misignal/index.html" },
      "financial-japan": { label: "ファイナンシャル・ジャパン", source: "https://financialjapan.jp/recruit/", preview: "financial-japan/index.html" },
      elixir: { label: "エリクシール", source: "https://www.shiseido.co.jp/elixir/promotion/brightening-lotion-emulsion/", preview: "elixir/index.html" },
      stripe: { label: "Stripe", source: "https://stripe.com/jp", preview: "stripe/index.html" },
      zendesk: { label: "Zendesk", source: "https://www.zendesk.co.jp/lp/nb-support/", preview: "zendesk/index.html" }
    };
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const frame = document.getElementById("site-frame");
    const sourceLink = document.getElementById("source-link");

    function selectSite(site, updateHash = true) {
      if (!Object.hasOwn(sites, site)) site = "haagen-dazs";
      tabs.forEach(tab => {
        const selected = tab.dataset.site === site;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      const currentPath = sites[site].preview;
      if (frame.getAttribute("src") !== currentPath) frame.src = currentPath;
      frame.title = `${sites[site].label} LPプレビュー`;
      frame.setAttribute("aria-labelledby", `tab-${site}`);
      sourceLink.href = sites[site].source;
      sourceLink.textContent = sites[site].source;
      if (updateHash && location.hash !== `#${site}`) history.replaceState(null, "", `#${site}`);
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => selectSite(tab.dataset.site));
      tab.addEventListener("keydown", event => {
        const direction = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
        if (!direction) return;
        event.preventDefault();
        const next = tabs[(index + direction + tabs.length) % tabs.length];
        selectSite(next.dataset.site);
        next.focus();
      });
    });
    window.addEventListener("hashchange", () => selectSite(location.hash.slice(1)));
    selectSite(location.hash.slice(1));
  </script>
</body>
</html>
