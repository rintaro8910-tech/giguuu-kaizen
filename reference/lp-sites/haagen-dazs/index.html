    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px; }
    main { width: min(100%, 600px); padding: clamp(32px, 6vw, 64px); background: #fff; border: 1px solid #e6e1d7; text-align: center; }

    p { margin: 0; line-height: 1.9; }
    a { display: inline-block; margin-top: 32px; padding: 13px 28px; border: 1px solid #26302a; color: inherit; font-weight: 700; text-decoration: none; }
    a:hover, a:focus-visible { color: #fff; background: #26302a; }
  </style>
</head>
<body>
  <main>
    <h1>ハーゲンダッツ</h1>
    <p>元サイトはこの参照画面への埋め込みを許可していません。別タブで公式サイトをご確認ください。</p>

</html>
