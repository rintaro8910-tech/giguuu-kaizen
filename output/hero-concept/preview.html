<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TELEMO ヒーロー改善案</title>
  <link rel="icon" href="data:," />
  <!--
    ヒーロー改善案（docs/research/hero-ui-ideas-2026-10-12.md「6. 改善案」の推奨3案）を現行ヒーローに重ねた静止プレビュー。
      案1 写真の右下に「AI通話ログ」のガラスカード（Parloa 型）
      案2 文字の下地を黒ではなく 透明→ティール #007d8c の下側グラデにし、その面に導入ロゴの帯（Clarion 型）
      案3 写真を余白付きの角丸パネルに収め、白地のページと地続きにする（Lightship / Aevion 型）
    書体・寸法・ボタンの形は、ドキュメンタリー版ヒーロー（.doc-hero / hero-documentary.css + hero-copy.css）から写した。
    文言は最後の .doc-hero のもの（見出し・リードは現在の index.html と同じ。ボタン「事業を知る」「お問い合わせ」は .doc-hero のもの。
    現在の index.html のヒーローは .editorial-hero に置き換わっていて、.doc-hero の HTML は無い）。
    サイトの CSS は読み込まず、必要なルールだけ写す。本文の Noto Sans JP はサイトと同じ reference/fonts.css。
    写真は ?img=<このファイルからの相対パス> で差し替える（既定 ../../assets/hero/callcenter-hero-poster.jpg）。PNG の書き出しは render.py。
  -->
  <link rel="stylesheet" href="../../reference/fonts.css" />
  <style>
    :root {
      /* index-refine.css のトークン */
      --rf-accent: #007d8c;
      --rf-cta: #fd8e44;
      --rf-heading: #0a2a44;
      --rf-text: #34424e;
      --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
      /* このプレビューの寸法 */
      --inset: 16px;                        /* 案3: パネルの外の白い余白 */
      --radius: 20px;
      --pad-l: clamp(40px, 5.5vw, 80px);    /* 文字の左端。1440 で現行（本文幅 1248px の左端 96px）とほぼ同じ位置 */
      --pad-r: clamp(28px, 3.5vw, 56px);
      --card-w: clamp(300px, 24vw, 360px);  /* 案1: ガラスカードの幅 */
      --band-h: 88px;                       /* 案2: ロゴ帯の高さ */
      --copy-pb: 40px;                      /* CTA の下端とロゴ帯の間 */
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #fff;
      color: var(--rf-text);
      font: 500 16px/1.85 "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      font-feature-settings: "palt";
      letter-spacing: .04em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    i { font-style: normal; }
    p, h1, ol, ul { margin: 0; }
    button { font: inherit; cursor: pointer; }

    /* ---------- 案3: 白地の中の角丸パネル ---------- */
    .hero { padding: var(--inset); background: #fff; }
    .hero__panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: calc(100vh - var(--inset) * 2);
      min-height: 600px;
      color: #fff;
    }
    .hero__media {
      position: absolute;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      border-radius: var(--radius);
      background: #1c1e22;
    }
    .hero__img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 62% 40%;
    }
    /* 上端: ヘッダーの白文字を読むための影（黒ではなく見出しの紺）
       下側 45%: 案2 の 透明→ティール。下端は 0.92 でほぼ単色にし、ロゴ帯の台にする */
    .hero__scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(10, 42, 68, .5) 0%, rgba(10, 42, 68, 0) 28%),
        linear-gradient(180deg, rgba(0, 125, 140, 0) 55%, rgba(0, 125, 140, .38) 70%, rgba(0, 125, 140, .78) 86%, rgba(0, 125, 140, .92) 100%);
    }
    /* フィルムグレイン（静止） */
    .hero__grain {
      position: absolute;
      inset: 0;
      background: url("../../assets/hero/grain.png") repeat;
      background-size: 160px 160px;
      opacity: .08;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* ---------- ヘッダー（簡略。写真の上に白文字） ---------- */
    .hd {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      height: 84px;
      padding: 0 var(--pad-r) 0 var(--pad-l);
    }
    .hd__logo {
      flex: none;
      color: #fff;
      font: 900 28px/1 "Arial Black", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: -.005em;
    }
    .hd__nav { display: flex; gap: clamp(18px, 2.6vw, 40px); margin-left: clamp(32px, 8vw, 140px); }
    .hd__nav a {
      color: rgba(255, 255, 255, .88);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .hd__nav a[aria-current] { color: #fff; font-weight: 700; }
    .hd__contact {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 18px;
      height: 50px;
      margin-left: auto;
      padding: 0 8px 0 22px;
      border-radius: 999px;
      background: var(--rf-accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .hd__contact i {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1.5px solid #fff;
      border-radius: 50%;
      font-size: 17px;
      line-height: 1;
    }
    .hd__burger {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 40px;
      height: 40px;
      margin-left: auto;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 50%;
      background: rgba(255, 255, 255, .2);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    .hd__burger span { width: 16px; height: 1.5px; border-radius: 1px; background: #fff; }

    /* ---------- 文字（hero-documentary.css + hero-copy.css の field-copy から写す） ---------- */
    .hero__copy {
      position: relative;
      z-index: 2;
      padding: 0 calc(var(--card-w) + var(--pad-r) + 32px) var(--copy-pb) var(--pad-l); /* 右はカードの分を空ける */
    }
    .hero__title {
      max-width: 13em;
      margin: 0 0 clamp(20px, 2.6vw, 32px);
      color: #fff;
      font-family: var(--mincho);
      font-size: clamp(30px, 3.45vw, 58px);
      font-weight: 600;
      line-height: 1.6;
      letter-spacing: -.04em;
      text-shadow: 0 2px 24px rgba(0, 0, 0, .28);
    }
    .hero__title span { display: block; white-space: nowrap; }
    .hero__lead {
      max-width: 34em;
      margin: 0 0 clamp(28px, 3.4vw, 44px);
      color: rgba(255, 255, 255, .92);
      font-size: clamp(14px, 1.15vw, 17px);
      font-weight: 500;
      line-height: 2;
      letter-spacing: .06em;
      text-shadow: 0 1px 12px rgba(0, 0, 0, .3);
    }
    .hero__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      padding: 0 28px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.6;
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .btn--primary {
      min-width: 252px;
      justify-content: space-between;
      gap: 32px;
      padding: 0 10px 0 40px;
      background: var(--rf-cta);
      color: #1b1b1b;
    }
    .btn__arrow {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(27, 27, 27, .45);
      border-radius: 50%;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
    }
    .btn--ghost {
      min-width: 208px;
      border-color: rgba(255, 255, 255, .72);
      background: transparent;
      color: #fff;
    }

    /* ---------- 案1: AI通話ログのガラスカード（右下。下端は CTA の下端にそろえる） ---------- */
    .call {
      position: absolute;
      z-index: 2;
      right: var(--pad-r);
      bottom: calc(var(--band-h) + var(--copy-pb));
      width: var(--card-w);
      padding: 16px 16px 14px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 14px;
      background: rgba(255, 255, 255, .14);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 40px rgba(0, 40, 50, .18);
      color: #fff;
    }
    .call__log { display: grid; gap: 8px; margin-bottom: 12px; padding: 0; list-style: none; }
    /* 吹き出し。話し手（顧客 / AI）は吹き出しの頭に小さく入れ、カードの背を低くする（顔・受話器に掛からないように） */
    .msg {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: baseline;
      column-gap: 8px;
      justify-self: start;
      max-width: 94%;
      padding: 8px 12px;
      border-radius: 12px 12px 12px 4px;
      background: rgba(255, 255, 255, .16);
      font-size: 13px;
      line-height: 1.6;
      letter-spacing: .04em;
    }
    .msg--ai { justify-self: end; border-radius: 12px 12px 4px 12px; background: rgba(0, 125, 140, .8); }
    .msg__who { color: rgba(255, 255, 255, .72); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
    .msg--ai .msg__who { color: rgba(255, 255, 255, .82); }
    .call__result {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px 5px 5px;
      border-radius: 999px;
      background: #fff;
      color: var(--rf-heading);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .call__check {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--rf-accent);
      color: #fff;
      font-size: 12px;
      line-height: 1;
    }

    /* 一時停止（SP だけ表示） */
    .hero__pause {
      display: none;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 50%;
      background: rgba(255, 255, 255, .2);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      letter-spacing: 1px;
    }

    /* ---------- 案2: グラデの濃い面に導入企業ロゴの帯（ダミー） ---------- */
    .logos {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: clamp(20px, 2.6vw, 40px);
      height: var(--band-h);
      margin: 0 var(--pad-r) 0 var(--pad-l);
      border-top: 1px solid rgba(255, 255, 255, .2);
    }
    .logos__label {
      flex: none;
      color: rgba(255, 255, 255, .84);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      white-space: nowrap;
    }
    .logos__list {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(12px, 1.8vw, 28px);
      padding: 0;
      list-style: none;
    }
    .logos__list li {
      display: grid;
      place-items: center;
      height: 40px;
      border-radius: 8px;
      background: rgba(236, 240, 243, .9);
      color: #8a95a5;
      font: 700 12px/1 "Space Grotesk", Arial, sans-serif;
      letter-spacing: .24em;
    }

    /* ---------- タブレット: ナビをメニューボタンに ---------- */
    @media (max-width: 1023px) {
      .hd__nav,
      .hd__contact { display: none; }
      .hd__burger { display: flex; }
    }

    /* ---------- SP: 写真パネル → 白地の文字の縦積み ---------- */
    @media (max-width: 767px) {
      :root { --inset: 12px; --radius: 16px; }
      .hero { padding: var(--inset) var(--inset) 0; }
      .hero__panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        height: auto;
        min-height: 0;
        color: var(--rf-heading);
      }
      .hero__media { position: relative; grid-area: 1 / 1; height: 56vh; }
      .hero__img { object-position: 72% 30%; } /* 右の男性の顔を入れる（現行の SP と同じ） */
      .hero__scrim {
        background:
          linear-gradient(180deg, rgba(10, 42, 68, .45) 0%, rgba(10, 42, 68, 0) 24%),
          linear-gradient(180deg, rgba(0, 125, 140, 0) 66%, rgba(0, 125, 140, .55) 88%, rgba(0, 125, 140, .8) 100%);
      }
      .hd { height: 60px; padding: 0 10px 0 18px; }
      .hd__logo { font-size: 22px; }

      /* ガラスカードはピルだけを写真の下端に。右下は一時停止ボタン */
      .call {
        position: relative;
        right: auto;
        bottom: auto;
        grid-area: 1 / 1;
        align-self: end;
        justify-self: start;
        width: auto;
        margin: 0 0 16px 12px;
        padding: 4px;
        border-radius: 999px;
        box-shadow: none; /* 影が写真の外の白地ににじむため */
      }
      .call__log { display: none; }
      .call__result { padding: 3px 12px 3px 3px; font-size: 12px; }
      .hero__pause { display: grid; position: relative; z-index: 2; grid-area: 1 / 1; align-self: end; justify-self: end; margin: 0 12px 12px 0; }

      .hero__copy { grid-row: 2; padding: 22px 8px 16px; }
      .hero__title {
        margin-bottom: 18px;
        color: var(--rf-heading);
        font-size: clamp(22px, 6.3vw, 38px);
        line-height: 1.6;
        text-shadow: none;
      }
      .hero__lead {
        margin-bottom: 26px;
        color: var(--rf-text);
        font-size: 14px;
        line-height: 1.9;
        letter-spacing: .04em;
        text-shadow: none;
      }
      .hero__actions { flex-direction: column; align-items: stretch; gap: 12px; }
      .btn { width: 100%; min-height: 54px; }
      .btn--primary,
      .btn--ghost { min-width: 0; }
      .btn--ghost { border-color: var(--rf-accent); color: var(--rf-accent); } /* 白地では index-refine.css と同じティールの枠 */
      .logos { display: none; }
    }
  </style>
</head>
<body>
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero__panel">
      <div class="hero__media" aria-hidden="true">
        <img class="hero__img" src="../../assets/hero/callcenter-hero-poster.jpg" alt="" />
        <div class="hero__scrim"></div>
        <div class="hero__grain"></div>
      </div>
      <script>
        // ?img=<このファイルからの相対パス> で写真を差し替える
        (() => {
          const src = new URLSearchParams(location.search).get("img");
          if (src) document.querySelector(".hero__img").src = src;
        })();
      </script>

      <header class="hd">
        <a class="hd__logo" href="#">TELEMO</a>
        <nav class="hd__nav" aria-label="メインナビゲーション">
          <a href="#" aria-current="page">私たちについて</a>
          <a href="#">サービス</a>
          <a href="#">活用シーン</a>
          <a href="#">ニュース</a>
          <a href="#">採用情報</a>
        </nav>
        <a class="hd__contact" href="#"><span>お問い合わせ</span><i aria-hidden="true">→</i></a>
        <button class="hd__burger" type="button" aria-label="メニューを開く"><span></span><span></span><span></span></button>
      </header>

      <div class="hero__copy">
        <h1 class="hero__title" id="hero-title"><span>現場を知り尽くした、</span><span>コールセンター経営者が</span><span>つくったAI</span></h1>
        <p class="hero__lead">現場で培った営業ノウハウを、AIで再現。</p>
        <div class="hero__actions">
          <a class="btn btn--primary" href="#"><span>事業を知る</span><i class="btn__arrow" aria-hidden="true">→</i></a>
          <a class="btn btn--ghost" href="#"><span>お問い合わせ</span></a>
        </div>
      </div>

      <aside class="call" aria-label="AI通話ログ（表示例）">
        <ol class="call__log">
          <li class="msg"><span class="msg__who">顧客</span><span>来週の火曜なら時間が取れます</span></li>
          <li class="msg msg--ai"><span class="msg__who">AI</span><span>ありがとうございます。<br />火曜 14時でお約束します</span></li>
          <li class="msg"><span class="msg__who">顧客</span><span>お願いします</span></li>
        </ol>
        <p class="call__result"><span class="call__check" aria-hidden="true">✓</span>アポ獲得 ・ 通話 1分12秒</p>
      </aside>

      <button class="hero__pause" type="button" aria-label="背景の動きを一時停止" aria-pressed="false">❚❚</button>

      <div class="logos">
        <p class="logos__label">導入企業（ダミー）</p>
        <ul class="logos__list" aria-label="導入企業ロゴ（ダミー）">
          <li>LOGO</li>
          <li>LOGO</li>
          <li>LOGO</li>
          <li>LOGO</li>
          <li>LOGO</li>
          <li>LOGO</li>
        </ul>
      </div>
    </div>
  </section>
</body>
</html>
